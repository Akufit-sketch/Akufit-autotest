<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aku fitness program</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#e9ebe7;--card:#f6f7f4;--ink:#1b2421;--mute:#66706b;--line:#cfd3cd;--acc:#2f5bff;--accink:#fff;--ok:#1f8a4c;--dan:#c23b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2421;--ink:#eef1ee;--mute:#98a39d;--line:#333c37;--acc:#7a9bff;--accink:#0d1320;--ok:#52c585;--dan:#ef7b7b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 12px;border-bottom:1px solid var(--line)}
.app{font:700 20px/1 "Barlow Semi Condensed",system-ui,sans-serif;margin:0 0 8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 2px;font:700 15px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;text-align:center}
.tab small{display:block;font:500 12px/1.2 Barlow,system-ui,sans-serif;color:var(--mute);margin-top:2px}
.tab[aria-selected="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tab[aria-selected="true"] small{color:var(--accink);opacity:.85}
main{padding:12px;max-width:560px;margin:0 auto}
h1{font:700 26px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ex.done{border-color:var(--ok)}
.eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.en{font:700 18px/1.15 "Barlow Semi Condensed",system-ui,sans-serif}
.et{font:600 15px Barlow,system-ui,sans-serif;color:var(--acc);white-space:nowrap;background:none;border:0;padding:4px 0}
.note{color:var(--mute);font-size:13px;margin:-4px 0 8px}
.acts{display:flex;gap:8px;margin-bottom:6px}
.sm{flex:1;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 14px Barlow,system-ui,sans-serif;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.sm.v{color:var(--acc)}.sm.x{color:var(--dan)}
.row,.lab{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center}
.row{margin-top:6px}
.lab{color:var(--mute);font-size:12px;text-align:center;margin-bottom:-2px}
.sn{color:var(--mute);font-weight:600;text-align:center}
input[type=number],input[type=search]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 17px Barlow,system-ui,sans-serif;text-align:center;padding:0 8px}
input[type=search]{text-align:left;font-weight:400}
input::placeholder{color:var(--mute);opacity:.7;font-weight:400}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chk{height:44px;width:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:transparent;font-size:20px;font-weight:700}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px "Barlow Semi Condensed",system-ui,sans-serif}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.link{display:block;width:100%;margin:0 0 30px;background:none;border:0;color:var(--mute);font:400 13px Barlow,system-ui,sans-serif;text-decoration:underline;padding:8px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#sheet.open{display:flex}
.sh{padding:10px 12px;border-bottom:1px solid var(--line)}
.shr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 14px Barlow,system-ui,sans-serif}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.list{flex:1;overflow-y:auto;padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:6px;font:600 16px Barlow,system-ui,sans-serif;min-height:48px}
.li small{color:var(--mute);font-weight:400;white-space:nowrap}
#tm{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#tm.on{display:flex}
#tm.end{background:var(--ok);color:#fff}
#tm strong{flex:1.4;text-align:center;font:700 32px/1 "Barlow Semi Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#tm .sm{flex:1}
.tabs{grid-template-columns:repeat(5,1fr);gap:4px}
.tab{font-size:14px}
.sim{display:flex;gap:6px;overflow-x:auto;margin:2px 0 8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.sim span{flex:none;align-self:center;color:var(--mute);font-size:12px}
.sc{flex:none;border-radius:16px;padding:6px 11px;min-height:34px;color:var(--ink);font:600 13px Barlow,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.st b{display:block;font:700 24px/1.1 "Barlow Semi Condensed",system-ui,sans-serif}
.st span{color:var(--mute);font-size:13px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sec h2,.h2{font:700 18px "Barlow Semi Condensed",system-ui,sans-serif;margin:0 0 6px}
.h2{margin:14px 0 8px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin:8px 0 4px}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0}
.bl{display:flex;gap:5px;font-size:10px;color:var(--mute)}.bl span{flex:1;text-align:center}
details.hs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
details.hs summary{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ln{font-size:14px;margin:6px 0 0}.ln b{font-weight:600}
select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 16px Barlow,system-ui,sans-serif;padding:0 8px;margin-bottom:8px}
.rts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.rt{min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 13px Barlow,system-ui,sans-serif}
.rt[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:400 16px Barlow,system-ui,sans-serif;padding:10px}
#fs{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
#fs.open{display:block}
#fs>*{max-width:560px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header><p class="app">Aku fitness program</p><div class="tabs" id="tabs" role="tablist"></div></header>
<main id="main"></main>
<div id="fs" role="dialog" aria-label="Fin de séance"></div>
<div id="tm" role="timer"><button class="sm" id="tmM">−15 s</button><strong id="tmT">0:00</strong><button class="sm" id="tmP">+15 s</button><button class="sm" id="tmS">Passer</button></div>
<div id="sheet" role="dialog" aria-label="Bibliothèque d’exercices">
<div class="sh"><div class="shr"><strong id="shT" style="font:700 20px 'Barlow Semi Condensed',system-ui,sans-serif">Bibliothèque</strong><button class="sm" id="shX" style="flex:none;padding:0 14px">Fermer</button></div>
<input type="search" id="q" placeholder="Rechercher un exercice"><div class="chips" id="chips"></div></div>
<div class="list" id="list"></div></div>
<script>
var LIB=[
["Développé couché barre","Pecs",4,"5-6"],["Développé couché haltères","Pecs",3,"8-10"],["Développé incliné barre","Pecs",3,"8-10"],["Développé incliné haltères","Pecs",3,"8-10"],["Développé décliné","Pecs",3,"8-10"],["Développé machine convergente","Pecs",3,"10-12"],["Pec fly machine","Pecs",3,"12-15"],["Écarté poulie vis-à-vis","Pecs",3,"12-15"],["Dips pecs","Pecs",3,"8-10"],["Pompes lestées","Pecs",3,"10-15"],
["Tractions","Dos",4,"6-8"],["Tirage vertical","Dos",4,"8-10"],["Tirage vertical prise serrée","Dos",3,"10"],["Rowing barre","Dos",4,"6-8"],["Rowing haltère unilatéral","Dos",3,"8-10"],["Rowing machine","Dos",3,"10-12"],["Tirage horizontal poulie","Dos",3,"10-12"],["Rowing T-bar","Dos",3,"8-10"],["Pull-over poulie","Dos",3,"12"],["Soulevé de terre","Dos",3,"5"],["Shrugs haltères","Dos",3,"12-15"],
["Développé militaire","Épaules",4,"5-6"],["Développé épaules haltères","Épaules",3,"8-10"],["Développé épaules machine","Épaules",3,"8-10"],["Élévations latérales","Épaules",4,"12-15"],["Élévations latérales poulie","Épaules",3,"12-15"],["Oiseau (arrière d’épaule)","Épaules",3,"15"],["Face pull","Épaules",3,"15"],["Élévations frontales","Épaules",3,"12"],
["Curl barre EZ","Biceps",3,"8-10"],["Curl haltères","Biceps",3,"10-12"],["Curl marteau","Biceps",3,"10-12"],["Curl pupitre","Biceps",3,"10-12"],["Curl poulie","Biceps",3,"12-15"],
["Triceps poulie corde","Triceps",3,"10-12"],["Barre au front","Triceps",3,"8-10"],["Dips triceps","Triceps",3,"8-10"],["Extension triceps nuque","Triceps",3,"10-12"],["Kickback poulie","Triceps",3,"12-15"],
["Squat barre","Jambes",4,"5-6"],["Presse à cuisses","Jambes",4,"8-10"],["Goblet squat","Jambes",3,"10-12"],["Fentes bulgares","Jambes",3,"8-10"],["Fentes marchées","Jambes",3,"10-12"],["Soulevé de terre roumain","Jambes",3,"8"],["Leg curl","Jambes",3,"10-12"],["Leg extension","Jambes",3,"12-15"],["Hip thrust","Jambes",3,"8-10"],["Mollets debout","Jambes",4,"12-15"],["Mollets assis","Jambes",3,"15"],["Adducteurs machine","Jambes",3,"12-15"],["Abducteurs machine","Jambes",3,"12-15"],
["Sauts sur box","Explosif",4,"4","Explosif, repos complet entre les séries"],["Sprints 20 m","Explosif",4,"1","Effort max, repos 1 min 30"],["Squat jump","Explosif",4,"5","Explosif, atterrissage souple"],["Kettlebell swing","Explosif",4,"10"],["Power clean","Explosif",5,"3"],["Medicine ball slam","Explosif",4,"8"],["Traîneau poussé","Explosif",4,"20 m"],
["Gainage","Abdos",3,"45 s"],["Relevé de jambes","Abdos",3,"12-15"],["Crunch poulie","Abdos",3,"12-15"],["Roue abdominale","Abdos",3,"8-12"],["Abdos : gainage ou relevé de jambes","Abdos",3,"max"],
["Tapis incliné","Cardio",1,"20 min"],["Vélo","Cardio",1,"20 min"],["Rameur","Cardio",1,"15 min"]];
var DEF=[
{n:"Push",d:"Jeu",t:"Pecs, épaules, triceps",ex:["Développé couché barre","Développé incliné haltères","Développé épaules machine","Pec fly machine","Élévations latérales","Triceps poulie corde","Barre au front"]},
{n:"Pull",d:"Ven",t:"Dos, biceps, arrière d’épaule",ex:["Tractions","Rowing barre","Tirage horizontal poulie","Pull-over poulie","Oiseau (arrière d’épaule)","Curl barre EZ","Curl marteau"]},
{n:"Jambes",d:"Sam",t:"Jambes et explosivité",ex:["Squat barre","Soulevé de terre roumain","Fentes bulgares","Leg curl","Leg extension","Mollets debout","Sauts sur box","Sprints 20 m"]},
{n:"Haut",d:"Dim",t:"Haut du corps complet",ex:["Développé épaules haltères","Rowing barre","Développé incliné haltères","Tirage vertical prise serrée","Élévations latérales","Curl haltères","Triceps poulie corde","Abdos : gainage ou relevé de jambes"]}];
function byName(n){for(var i=0;i<LIB.length;i++)if(LIB[i][0]==n)return LIB[i];return null}
function mk(n){var l=byName(n);return{n:n,s:l?l[2]:3,r:l?l[3]:"10",note:l&&l[4]?l[4]:""}}
function defPlan(){return DEF.map(function(p){return{n:p.n,d:p.d,t:p.t,ex:p.ex.map(mk)}})}
var K="aku_v1",S={plan:defPlan(),cur:{},last:{},tab:0,hist:[],t0:{}};
try{var o=JSON.parse(localStorage.getItem(K)||"null");if(o){S.plan=o.plan||S.plan;S.cur=o.cur||{};S.last=o.last||{};S.tab=o.tab||0;S.hist=o.hist||[];S.t0=o.t0||{}}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify({plan:S.plan,cur:S.cur,last:S.last,tab:S.tab,hist:S.hist,t0:S.t0}))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function sv(m,n,i){return ((m[n]||[])[i])||{}}
function setv(n,i,f,v){if(!S.t0[S.tab])S.t0[S.tab]=Date.now();S.cur[n]=S.cur[n]||[];S.cur[n][i]=S.cur[n][i]||{};S.cur[n][i][f]=v;save()}
function vid(n){return "https://www.youtube.com/results?search_query="+encodeURIComponent(n+" exécution technique musculation")}
function tabs(){document.getElementById("tabs").innerHTML=S.plan.map(function(p,i){return '<button class="tab" role="tab" aria-selected="'+(i==S.tab)+'" data-t="'+i+'">'+p.d+'<small>'+p.n+'</small></button>'}).join("")+'<button class="tab" role="tab" aria-selected="'+(S.tab==4)+'" data-t="4">Bilan<small>Stats</small></button>'}
function render(){
if(S.tab==4){renderBilan();return}
var p=S.plan[S.tab],h='<h1>'+esc(p.n)+'</h1><p class="sub">'+esc(p.t)+'</p><div class="prog"><i id="pg"></i></div>';
p.ex.forEach(function(x,e){
h+='<section class="ex" id="ex'+e+'" style="'+famStyle(x.n)+'"><div class="eh"><div class="en">'+esc(x.n)+'</div><button class="et" data-a="sr" data-e="'+e+'" aria-label="Modifier séries et répétitions">'+x.s+' × '+esc(x.r)+'</button></div>';
if(x.note)h+='<p class="note">'+esc(x.note)+'</p>';
h+='<div class="acts"><a class="sm v" target="_blank" rel="noopener" href="'+vid(x.n)+'">▶ Vidéo</a><button class="sm" data-a="chg" data-e="'+e+'">Changer</button><button class="sm x" data-a="del" data-e="'+e+'">Retirer</button></div>';
h+=simHtml(x.n,e,p);h+='<div class="lab"><span></span><span>kg</span><span>reps</span><span></span></div>';
for(var i=0;i<x.s;i++){var c=sv(S.cur,x.n,i),l=sv(S.last,x.n,i);
h+='<div class="row"><span class="sn">'+(i+1)+'</span><input type="number" inputmode="decimal" step="0.5" placeholder="'+esc(l.kg||"")+'" value="'+esc(c.kg||"")+'" data-e="'+e+'" data-i="'+i+'" data-f="kg" aria-label="Poids série '+(i+1)+'"><input type="number" inputmode="numeric" placeholder="'+esc(l.reps||"")+'" value="'+esc(c.reps||"")+'" data-e="'+e+'" data-i="'+i+'" data-f="reps" aria-label="Répétitions série '+(i+1)+'"><button class="chk" aria-pressed="'+(!!c.ok)+'" data-a="ok" data-e="'+e+'" data-i="'+i+'" aria-label="Série '+(i+1)+' faite">✓</button></div>'}
h+='</section>'});
h+='<div class="bar"><button class="btn" data-a="add">+ Ajouter un exercice</button></div><div class="bar"><button class="btn" data-a="rst">Vider</button><button class="btn p" data-a="fin">Terminer la séance</button></div><button class="link" data-a="def">Remettre le programme initial</button>';
document.getElementById("main").innerHTML=h;prog()}
function prog(){var p=S.plan[S.tab],t=0,n=0;p.ex.forEach(function(x,e){var all=true;for(var i=0;i<x.s;i++){t++;if(sv(S.cur,x.n,i).ok)n++;else all=false}var el=document.getElementById("ex"+e);if(el)el.classList.toggle("done",all)});var g=document.getElementById("pg");if(g)g.style.width=(t?n/t*100:0)+"%"}
var grp="Tous",mode=null;
function openSheet(m){mode=m;grp="Tous";document.getElementById("q").value="";document.getElementById("shT").textContent=m.k=="add"?"Ajouter un exercice":"Remplacer l’exercice";var gs=["Tous"];LIB.forEach(function(x){if(gs.indexOf(x[1])<0)gs.push(x[1])});document.getElementById("chips").innerHTML=gs.map(function(g){return '<button class="chip" data-g="'+esc(g)+'" aria-pressed="'+(g==grp)+'">'+g+'</button>'}).join("");document.getElementById("sheet").classList.add("open");fill()}
function fill(){var q=document.getElementById("q").value.toLowerCase().trim();document.getElementById("list").innerHTML=LIB.map(function(x,i){return[x,i]}).filter(function(a){return(grp=="Tous"||a[0][1]==grp)&&a[0][0].toLowerCase().indexOf(q)>=0}).map(function(a){return '<button class="li" data-l="'+a[1]+'"><span>'+esc(a[0][0])+'</span><small>'+a[0][1]+'</small></button>'}).join("")||'<p class="sub">Aucun exercice trouvé.</p>'}
function closeSheet(){document.getElementById("sheet").classList.remove("open")}
document.addEventListener("click",function(ev){
var b=ev.target.closest("button");if(!b)return;
var p=S.plan[S.tab],a=b.dataset.a,e=+b.dataset.e;
if(b.dataset.t!==undefined){S.tab=+b.dataset.t;save();tabs();render();window.scrollTo(0,0);return}
if(b.dataset.g!==undefined){grp=b.dataset.g;Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed",c.dataset.g==grp)});fill();return}
if(b.dataset.l!==undefined){var l=LIB[+b.dataset.l],x=mk(l[0]);if(mode.k=="add")p.ex.push(x);else p.ex[mode.e]=x;save();closeSheet();render();return}
if(b.id=="shX"){closeSheet();return}
if(b.id=="tmM"){rt.end-=15000;tick();return}
if(b.id=="tmP"){rt.end=Math.max(rt.end,Date.now())+15000;rt.fired=false;tick();return}
if(b.id=="tmS"){stopRest();return}
if(b.dataset.s!==undefined){p.ex[e]=mk(LIB[+b.dataset.s][0]);save();render();return}
if(a=="fx"){document.getElementById("fs").classList.remove("open");return}
if(a=="rate"){fr=+b.dataset.v;Array.prototype.forEach.call(document.querySelectorAll(".rt"),function(c){c.setAttribute("aria-pressed",+c.dataset.v==fr)});return}
if(a=="hdel"){if(confirm("Effacer tout l’historique des séances ?")){S.hist=[];save();renderBilan()}return}
if(a=="ok"){var i=+b.dataset.i,v=!sv(S.cur,p.ex[e].n,i).ok;setv(p.ex[e].n,i,"ok",v);b.setAttribute("aria-pressed",v);prog();if(v)startRest(p.ex[e]);return}
if(a=="add"){openSheet({k:"add"});return}
if(a=="chg"){openSheet({k:"chg",e:e});return}
if(a=="del"){if(confirm("Retirer « "+p.ex[e].n+" » de cette séance ?")){p.ex.splice(e,1);save();render()}return}
if(a=="sr"){var x=p.ex[e],r=prompt("Séries × répétitions (ex : 4x8-10)",x.s+"x"+x.r);if(r){var m=r.replace(/×/g,"x").match(/^\s*(\d+)\s*x\s*(.+)$/i);if(m&&+m[1]>0&&+m[1]<=10){x.s=+m[1];x.r=m[2].trim();save();render()}}return}
if(a=="fin"){openFinish();return}
if(a=="fsave"){saveSession(p);
p.ex.forEach(function(x){var c=S.cur[x.n];if(c){S.last[x.n]=c.map(function(s){return s?{kg:s.kg,reps:s.reps}:{}});delete S.cur[x.n]}});save();render();window.scrollTo(0,0);return}
if(a=="rst"){if(!confirm("Vider les saisies de cette séance ?"))return;p.ex.forEach(function(x){delete S.cur[x.n]});save();render();return}
if(a=="def"){if(confirm("Remettre les 4 séances du programme initial ? Tes historiques de charges sont conservés.")){S.plan=defPlan();save();tabs();render()}}});
document.addEventListener("input",function(ev){var t=ev.target;if(t.id=="q"){fill();return}if(t.dataset.f){setv(S.plan[S.tab].ex[+t.dataset.e].n,+t.dataset.i,t.dataset.f,t.value)}});
var rt={end:0,iv:null,ac:null,fired:false};
function startRest(x){var n=parseInt(x.r),s=x.note?120:(n<=6?150:(n<=10?90:60));rt.end=Date.now()+s*1000;rt.fired=false;try{rt.ac=rt.ac||new(window.AudioContext||window.webkitAudioContext)();if(rt.ac.state=="suspended")rt.ac.resume()}catch(e){}document.getElementById("tm").classList.add("on");document.getElementById("main").style.paddingBottom="96px";clearInterval(rt.iv);rt.iv=setInterval(tick,250);tick()}
function tick(){var left=Math.ceil((rt.end-Date.now())/1000),el=document.getElementById("tmT"),bar=document.getElementById("tm");if(left>0){el.textContent=Math.floor(left/60)+":"+("0"+left%60).slice(-2);bar.classList.remove("end")}else{el.textContent="Go !";bar.classList.add("end");if(!rt.fired){rt.fired=true;beep()}if(left<-10)stopRest()}}
function beep(){try{var a=rt.ac,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(a.currentTime+.4)}catch(e){}try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function stopRest(){clearInterval(rt.iv);document.getElementById("tm").classList.remove("on","end");document.getElementById("main").style.paddingBottom=""}
var FAMS=[
["Développé couché barre","Développé couché haltères","Développé machine convergente","Développé décliné","Pompes lestées","Dips pecs"],
["Développé incliné barre","Développé incliné haltères","Développé couché haltères"],
["Pec fly machine","Écarté poulie vis-à-vis"],
["Tractions","Tirage vertical","Tirage vertical prise serrée","Pull-over poulie"],
["Rowing barre","Rowing haltère unilatéral","Rowing machine","Tirage horizontal poulie","Rowing T-bar"],
["Soulevé de terre","Soulevé de terre roumain","Hip thrust"],
["Développé militaire","Développé épaules haltères","Développé épaules machine"],
["Élévations latérales","Élévations latérales poulie","Élévations frontales"],
["Oiseau (arrière d’épaule)","Face pull"],
["Curl barre EZ","Curl haltères","Curl marteau","Curl pupitre","Curl poulie"],
["Triceps poulie corde","Extension triceps nuque","Kickback poulie","Barre au front","Dips triceps"],
["Squat barre","Presse à cuisses","Goblet squat","Fentes bulgares","Fentes marchées"],
["Leg curl","Soulevé de terre roumain"],
["Leg extension","Presse à cuisses"],
["Mollets debout","Mollets assis"],
["Sauts sur box","Squat jump"],
["Sprints 20 m","Traîneau poussé"],
["Kettlebell swing","Power clean","Medicine ball slam"],
["Gainage","Relevé de jambes","Crunch poulie","Roue abdominale","Abdos : gainage ou relevé de jambes"],
["Tapis incliné","Vélo","Rameur"],
["Adducteurs machine","Abducteurs machine"]];
var RE=["","😫","😕","😐","🙂","💪"],fr=3,px="";
function fidx(n){for(var i=0;i<FAMS.length;i++)if(FAMS[i].indexOf(n)>=0)return i;return -1}
function hue(n){var i=fidx(n);return i<0?-1:(i*47+15)%360}
function famStyle(n){var h=hue(n);return h<0?"":"border-left:5px solid hsl("+h+" 65% 48%)"}
function libIdx(n){for(var i=0;i<LIB.length;i++)if(LIB[i][0]==n)return i;return -1}
function simHtml(n,e,p){var h=hue(n);if(h<0)return "";var used=p.ex.map(function(x){return x.n}),out=[];
FAMS.forEach(function(f){if(f.indexOf(n)>=0)f.forEach(function(m){if(m!=n&&used.indexOf(m)<0&&out.indexOf(m)<0&&libIdx(m)>=0)out.push(m)})});
if(!out.length)return "";
return '<div class="sim"><span>Similaires</span>'+out.slice(0,6).map(function(m){return '<button class="sc" data-s="'+libIdx(m)+'" data-e="'+e+'" style="background:hsl('+h+' 70% 50% / .16);border:1px solid hsl('+h+' 65% 48%)">'+esc(m)+'</button>'}).join("")+'</div>'}
function fnum(n){return Math.round(n).toLocaleString("fr-FR")}
function e1(kg,r){return (+kg||0)*(1+(+r||0)/30)}
function st(v,l){return '<div class="st"><b>'+v+'</b><span>'+l+'</span></div>'}
function dstr(t,l){return new Date(t).toLocaleDateString("fr-FR",l?{weekday:"short",day:"numeric",month:"short"}:{day:"2-digit",month:"2-digit"})}
function sets(x){return x.s.map(function(a){return (a[0]?a[0]+" kg":"PdC")+" × "+a[1]}).join(" · ")}
function sessData(p){var ex=[];p.ex.forEach(function(x){var s=(S.cur[x.n]||[]).filter(function(a){return a&&+a.reps>0}).map(function(a){return [+a.kg||0,+a.reps]});if(s.length)ex.push({n:x.n,s:s})});return ex}
function tot(ex){var t=0,n=0;ex.forEach(function(x){x.s.forEach(function(a){t+=a[0]*a[1];n++})});return [t,n]}
function prevBest(n){var b=0;S.hist.forEach(function(h){h.ex.forEach(function(x){if(x.n==n)x.s.forEach(function(a){b=Math.max(b,e1(a[0],a[1]))})})});return b}
function sessPR(ex){return ex.filter(function(x){var pb=prevBest(x.n),m=Math.max.apply(null,x.s.map(function(a){return e1(a[0],a[1])}));return pb>0&&m>pb+0.01}).map(function(x){return x.n})}
function durMin(){return S.t0[S.tab]?Math.max(1,Math.round((Date.now()-S.t0[S.tab])/60000)):0}
function openFinish(){
var p=S.plan[S.tab],ex=sessData(p);
if(!ex.length){alert("Saisis au moins une série avec des répétitions avant de terminer la séance.");return}
var t=tot(ex),d=durMin(),pr=sessPR(ex);fr=3;
var h='<h1>Séance terminée</h1><p class="sub">'+esc(p.n)+'</p><div class="grid">'+st(fnum(t[0])+" kg","tonnage")+st(t[1],"séries")+st(ex.length,"exercices")+st(d?d+" min":"–","durée")+'</div>';
if(pr.length)h+='<div class="sec"><h2>🏆 Nouveaux records</h2><p class="ln">'+pr.map(esc).join(", ")+'</p></div>';
h+='<div class="sec"><h2>Ton ressenti</h2><div class="rts">'+[1,2,3,4,5].map(function(i){return '<button class="rt" data-a="rate" data-v="'+i+'" aria-pressed="'+(i==3)+'">'+RE[i]+'<br>'+i+'</button>'}).join("")+'</div><textarea id="fn" placeholder="Note : fatigue, douleurs, sensations…"></textarea></div>';
h+='<div class="bar"><button class="btn" data-a="fx">Annuler</button><button class="btn p" data-a="fsave">Enregistrer</button></div>';
var f=document.getElementById("fs");f.innerHTML=h;f.classList.add("open");f.scrollTop=0}
function saveSession(p){var ex=sessData(p);if(ex.length){var n=document.getElementById("fn");S.hist.push({t:Date.now(),d:S.tab,n:p.n,dur:durMin(),r:fr,note:n?n.value:"",ex:ex})}delete S.t0[S.tab];document.getElementById("fs").classList.remove("open")}
function renderBilan(){
var H=S.hist,m=document.getElementById("main");
if(!H.length){m.innerHTML='<h1>Bilan</h1><p class="sub">Aucune séance enregistrée pour l’instant. Termine une séance avec « Terminer la séance » pour voir ta progression ici.</p>';return}
var T=0,N=0,R=0,wk=0,now=Date.now();
H.forEach(function(h){var t=tot(h.ex);T+=t[0];N+=t[1];R+=h.r||0;if(now-h.t<6048e5)wk++});
var o='<h1>Bilan</h1><p class="sub">Compte rendu de tes séances</p><div class="grid">'+st(H.length,"séances")+st(wk,"sur 7 jours")+st(fnum(T)+" kg","tonnage total")+st(N,"séries validées")+st((R/H.length).toFixed(1)+" / 5","ressenti moyen")+st(fnum(T/H.length)+" kg","tonnage moyen")+'</div>';
var L=H.slice(-10),vals=L.map(function(h){return tot(h.ex)[0]}),mx=Math.max.apply(null,vals)||1;
o+='<div class="sec"><h2>Tonnage par séance</h2><div class="bars">'+vals.map(function(v){return '<i style="height:'+Math.max(3,v/mx*100)+'%"></i>'}).join("")+'</div><div class="bl">'+L.map(function(h){return '<span>'+dstr(h.t)+'</span>'}).join("")+'</div></div>';
var names=[];H.forEach(function(h){h.ex.forEach(function(x){if(names.indexOf(x.n)<0)names.push(x.n)})});names.sort();
if(names.indexOf(px)<0)px=names[0];
var pts=[],rec={};
H.forEach(function(h){h.ex.forEach(function(x){var b=0,bs="",tn=0;x.s.forEach(function(a){var v=e1(a[0],a[1]),lb=(a[0]?a[0]+" kg":"PdC")+" × "+a[1];tn+=a[0]*a[1];if(v>=b){b=v;bs=lb}if(!rec[x.n]||v>rec[x.n].v)rec[x.n]={v:v,s:lb}});if(x.n==px)pts.push({t:h.t,v:b,s:bs,tn:tn})})});
o+='<div class="sec"><h2>Progression par exercice</h2><select id="px" aria-label="Exercice">'+names.map(function(n){return '<option'+(n==px?" selected":"")+'>'+esc(n)+'</option>'}).join("")+'</select>';
if(pts.length>1){var vs=pts.map(function(q){return q.v}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs),xy=pts.map(function(q,i){return [10+i*280/(pts.length-1),105-(q.v-lo)/((hi-lo)||1)*90]});
o+='<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Courbe de progression"><polyline fill="none" stroke-width="2.5" style="stroke:var(--acc)" points="'+xy.map(function(c){return c[0].toFixed(1)+","+c[1].toFixed(1)}).join(" ")+'"/>'+xy.map(function(c){return '<circle r="3.5" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" style="fill:var(--acc)"/>'}).join("")+'</svg>';
var f0=vs[0],l0=vs[vs.length-1],pc=f0?(l0-f0)/f0*100:0;
o+='<p class="ln"><b>Évolution :</b> '+(f0?(pc>=0?"+":"")+pc.toFixed(1)+" %":"–")+' (1RM estimé '+Math.round(f0)+' → '+Math.round(l0)+' kg)</p>'}
else o+='<p class="ln">Une seule séance pour cet exercice : la courbe apparaîtra à la prochaine.</p>';
o+=pts.slice(-5).reverse().map(function(q){return '<p class="ln">'+dstr(q.t)+' — <b>'+q.s+'</b> · '+fnum(q.tn)+' kg</p>'}).join("")+'</div>';
o+='<details class="hs"><summary>Records par exercice</summary>'+names.map(function(n){return '<p class="ln"><b>'+esc(n)+'</b> : '+rec[n].s+'</p>'}).join("")+'</details>';
o+='<p class="h2">Historique</p>'+H.slice().reverse().slice(0,30).map(function(h){var t=tot(h.ex);return '<details class="hs"><summary><span>'+dstr(h.t,1)+' · '+esc(h.n)+'</span><span>'+RE[h.r||3]+' '+fnum(t[0])+' kg</span></summary><p class="ln">'+t[1]+' séries · '+h.ex.length+' exercices'+(h.dur?" · "+h.dur+" min":"")+'</p>'+(h.note?'<p class="ln"><b>Note :</b> '+esc(h.note)+'</p>':"")+h.ex.map(function(x){return '<p class="ln"><b>'+esc(x.n)+'</b><br>'+sets(x)+'</p>'}).join("")+'</details>'}).join("");
o+='<button class="link" data-a="hdel">Effacer l’historique</button>';
m.innerHTML=o}
document.addEventListener("change",function(ev){if(ev.target.id=="px"){px=ev.target.value;renderBilan()}});
tabs();render();
</script>
